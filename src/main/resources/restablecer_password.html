<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer Contraseña - ROBOTech</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Estilos adicionales para mensajes */
    #form-message {
        border-radius: 4px;
        font-size: 0.9rem;
        margin-top: 10px;
    }
    .btn-main:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">ROBOTech</div>
    <nav class="nav">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="login.html" class="btn-login">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>

  <section class="form-section">
    <div class="form-container">
      <h2>Restablecer Contraseña</h2>
      <p class="form-desc">Ingresa tu nueva contraseña. Asegúrate de que sea segura.</p>
      
      <form id="reset-password-form">
        <div class="form-group">
          <label for="new-password">Nueva Contraseña</label>
          <input type="password" id="new-password" name="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirmar Contraseña</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="Repite la contraseña" required minlength="6">
        </div>

        <div id="form-message" style="display:none; padding: 15px; margin-bottom: 20px; text-align: center; font-weight: bold;"></div>

        <button type="submit" class="btn-main">Guardar Nueva Contraseña</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-about">
        <h3>ROBOTech</h3>
        <p>Innovación, competencia y pasión por la robótica.</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2025 ROBOTech | Innovación y competencia robótica</p>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('reset-password-form');
        const messageDiv = document.getElementById('form-message');
        const submitBtn = form.querySelector('button[type="submit"]');

        // 1. Obtener el token de la URL (ej. ?token=xyz...)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showMessage('Error: Enlace inválido o incompleto. Por favor solicita uno nuevo.', 'error');
            form.style.display = 'none'; // Ocultar formulario si no hay token
            return;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // 2. Validaciones locales
            if (newPassword !== confirmPassword) {
                showMessage('Las contraseñas no coinciden.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }

            // 3. Preparar envío
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Guardando...';
            messageDiv.style.display = 'none';

            try {
                // 4. Enviar al backend
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message || '¡Contraseña actualizada con éxito! Redirigiendo...', 'success');
                    form.reset();
                    setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                } else {
                    showMessage(data.message || 'Error al actualizar la contraseña.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            } catch (error) {
                console.error(error);
                showMessage('Error de conexión. Intenta nuevamente.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        function showMessage(msg, type) {
            messageDiv.textContent = msg;
            messageDiv.style.display = 'block';
            if (type === 'success') {
                messageDiv.style.backgroundColor = '#d4edda';
                messageDiv.style.color = '#155724';
                messageDiv.style.border = '1px solid #c3e6cb';
            } else {
                messageDiv.style.backgroundColor = '#f8d7da';
                messageDiv.style.color = '#721c24';
                messageDiv.style.border = '1px solid #f5c6cb';
            }
        }
    });
  </script>
</body>
</html>
