# ==========================================
# CONFIGURACIÓN DEL PUERTO DEL SERVIDOR
# ==========================================
server.port=${PORT:8080}

# ==========================================
# CONFIGURACIÓN DE LA BASE DE DATOS (POSTGRESQL - RENDER)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CREDENCIALES DEL ADMINISTRADOR DEL SISTEMA
# ==========================================
# Estas propiedades se usan para crear el admin la primera vez que se inicia la app.
app.admin.email=${APP_ADMIN_EMAIL:admin@robotech.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin12345}

# ==========================================
# CONFIGURACIÓN DE CORREOS OFICIALES
# ==========================================
app.robotech.official-email=${APP_ROBOTECH_EMAIL:oficial@robotech.com}

# ==========================================
# CONFIGURACIÓN DE JSON WEB TOKEN (JWT)
# ==========================================
# Es una MALA PRÁCTICA tener la clave secreta aquí. En un entorno real, se usan variables de entorno.
# Para que funcione, la clave debe ser lo suficientemente larga y segura (codificada en Base64).
jwt.secret=${JWT_SECRET:VGhpcy1Jcy1BLVZlcnktTG9uZy1hbmQtU2VjdXJlLVNlY3JldC1LZXktRm9yLUpXVC1TaWduaW5nLVB1cnBvc2VzCg==}
# Tiempo de expiración del token: 86400000 ms = 24 horas
jwt.expiration=86400000

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR DE CORREO (GMAIL)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# CONFIGURACIÓN DE SERIALIZACIÓN DE JACKSON
# ==========================================
# Evita que Jackson falle al serializar beans vacíos, como los proxies de Hibernate.
spring.jackson.serialization.fail-on-empty-beans=false

# ==========================================
# CONFIGURACIÓN DE CLOUDINARY (PARA IMÁGENES)
# ==========================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
spring.jackson.serialization.write-dates-as-timestamps=false
